<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaipa · 我的页面设计预览</title>
<style>
:root{color-scheme:light;--bg:#f5f5f5;--surface:#fefefe;--field:#efefef;--text:#333333;--secondary:#858585;--line:#eaeaea;--accent:#657846;--soft:#eff2e8;--stage:#ebebeb;--radius:16px;--feature:24px;--space:16px}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--stage)}body.dark{color-scheme:dark;--bg:#1c1c1e;--surface:#28282c;--field:#323236;--text:#ededee;--secondary:#aaa9af;--line:#38383c;--accent:#b4c594;--soft:#353b2d;--stage:#131315}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:hover{filter:brightness(.94)}svg{width:20px;height:20px;stroke-width:1.7;flex-shrink:0}h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:800}h2{font-size:18px}h3{font-size:15px}small{font-size:11px;color:var(--secondary)}.muted{color:var(--secondary)}
.studio{padding:24px 32px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand strong{font-size:23px}.brand span{font-size:12px;color:var(--secondary);border-left:1px solid var(--line);padding-left:12px}.tools{display:flex;align-items:center;gap:12px}.seg{display:flex;padding:4px;background:var(--field);border-radius:8px;gap:4px}.seg button{min-height:36px;padding:0 14px;font-size:12px;border-radius:5px;white-space:nowrap}.seg button.active{background:var(--surface);box-shadow:0 1px 4px #0000000c;font-weight:700}.icon{height:44px;width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}.theme{background:var(--surface)}.caption{max-width:1280px;margin:24px auto 20px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;color:var(--secondary)}
.gallery{max-width:1280px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:0 28px 48px;margin:auto}.variant-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}.variant-label strong{font-size:14px}.variant-label span{font-size:11px;color:var(--secondary)}.phone{height:810px;border:1px solid var(--line);border-radius:32px;overflow:hidden;background:var(--bg);position:relative;box-shadow:0 12px 35px #15241408}.status{height:38px;padding:14px 24px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700}.status .signals{display:flex;gap:5px}.status svg{height:13px;width:13px}.screen{height:calc(100% - 38px);overflow-y:auto;scrollbar-width:none;padding-bottom:94px}.screen::-webkit-scrollbar{display:none}.pad{padding:0 20px}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between}.actions{display:flex;gap:0}.bell{position:relative}.bell:after{content:"";width:5px;height:5px;background:#c77764;position:absolute;right:12px;top:10px;border-radius:50%}.profile{display:flex;align-items:center;gap:14px;padding:22px 0 25px;width:100%;text-align:left}.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0}.profile h2{font-size:21px;margin-bottom:6px}.profile p{font-size:12px;color:var(--secondary)}.profile .chev{margin-left:auto;color:var(--secondary);width:15px}.metrics{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:26px}.metrics button{flex:1;display:flex;align-items:baseline;justify-content:center;gap:10px}.metrics button+button{border-left:1px solid var(--line)}.metrics b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:25px;font-weight:500}.metrics span{font-size:12px;color:var(--secondary)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px}.section-head button{font-size:11px;color:var(--secondary);display:flex;align-items:center;gap:4px;padding:8px 0 8px 8px}.section-head svg{width:13px;height:13px}.feature{display:block;width:100%;padding:0;text-align:left}.landscape{width:100%;height:173px;object-fit:cover;display:block;border-radius:8px}.feature-copy{display:flex;align-items:center;justify-content:space-between;padding-top:14px;gap:8px}.meta{display:flex;gap:12px;align-items:center;margin-top:7px;font-size:11px;color:var(--secondary);flex-wrap:wrap}.meta span{display:flex;gap:4px;align-items:center}.meta svg{width:12px;height:12px}.tag{background:var(--soft);color:var(--accent);padding:5px 8px;border-radius:4px;font-size:10px;white-space:nowrap}.row{width:100%;display:flex;gap:12px;align-items:center;padding:12px 0;text-align:left;border-bottom:1px solid var(--line)}.row img{width:64px;height:64px;border-radius:8px;object-fit:cover}.row-copy{min-width:0;flex:1}.row h3{line-height:1.5}.row p{font-size:11px;color:var(--secondary);margin-top:5px;line-height:1.6}.row>svg{color:var(--secondary);width:14px}.tabs{position:absolute;bottom:15px;left:16px;right:16px;height:62px;border:1px solid var(--line);background:var(--surface);border-radius:32px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 6px 25px #00000008;z-index:2}.tabs button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:9px;color:var(--secondary);height:48px;width:52px}.tabs button.current{color:var(--accent)}.tabs button.current svg{fill:var(--soft)}.tabs svg{width:20px;height:20px}.home-indicator{position:absolute;bottom:5px;left:calc(50% - 44px);height:3px;width:88px;background:var(--text);border-radius:5px;opacity:.7}
.journal .profile{padding:12px 0 22px}.journal .avatar{width:44px;height:44px}.journal .profile h2{font-size:18px}.journal .hero-photo{display:block;width:100%;height:270px;object-fit:cover}.journal .hero-text{padding-top:18px}.eyebrow{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;color:var(--secondary);margin-bottom:9px}.journal .hero-text h2{font-size:23px;font-weight:650}.journal .hero-text p{font-size:12px;line-height:1.9;color:var(--secondary);margin:9px 0 19px}.journal .metrics{margin:0}.memory{display:flex;gap:16px;text-align:left;width:100%;padding:10px 0 14px}.memory time{width:37px;font-size:19px;font-family:ui-monospace,monospace;padding-top:3px;flex-shrink:0}.memory time small{display:block;font-family:inherit;font-size:10px;margin-top:5px}.memory img{width:66px;height:70px;border-radius:6px;object-fit:cover}.memory h3{padding-top:6px}.memory p{font-size:11px;color:var(--secondary);margin-top:7px}.workspace .profile{padding:16px 0 24px}.workspace .profile h2{font-size:20px}.plan{border-top:1px solid var(--line);padding-top:22px}.plan-title{display:flex;align-items:center;justify-content:space-between}.plan-title span{font-size:11px;color:var(--secondary)}.plan h2{font-size:24px;margin:18px 0 10px}.plan-image{width:100%;height:118px;object-fit:cover;border-radius:8px;margin:16px 0}.date-grid{display:flex;gap:24px;padding:2px 0 18px}.date-grid small{display:block;margin-bottom:6px}.date-grid strong{font-size:13px;font-weight:500}.progress-label{display:flex;justify-content:space-between;font-size:12px;margin:2px 0 10px}.progress-label span{color:var(--secondary);font-family:ui-monospace,monospace}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.progress i{display:block;width:67%;background:var(--accent);height:100%}.primary{width:100%;height:44px;border-radius:8px;background:var(--accent);color:var(--bg);font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px}.primary svg{width:16px}.shortcuts{margin-top:20px;border-top:1px solid var(--line)}.shortcut{display:flex;width:100%;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px}.shortcut>svg:first-child{color:var(--secondary)}.shortcut span{margin-left:auto;color:var(--secondary);font-size:12px}.shortcut>svg:last-child{width:14px;color:var(--secondary)}
.gallery.single{grid-template-columns:minmax(0,390px);justify-content:center}.gallery.single .variant:not(.chosen){display:none}dialog{padding:0;border:1px solid var(--line);border-radius:var(--feature);background:var(--bg);color:var(--text);width:min(390px,calc(100% - 32px));max-height:85vh;overflow:auto}dialog::backdrop{background:#0008;backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}.dialog-body{padding:20px}.dialog-body>p{font-size:13px;line-height:1.9;color:var(--secondary)}.dialog-body .landscape{margin-bottom:20px}.setting{width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:14px}.empty{padding:42px 0;text-align:center}.empty svg{width:32px;height:32px;color:var(--secondary);margin-bottom:16px}.empty h3{margin-bottom:10px}.checkrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.checkrow input{accent-color:var(--accent);width:18px;height:18px}.checkrow:has(input:checked) span{color:var(--secondary);text-decoration:line-through}.sample-note{font-size:10px;color:var(--secondary);margin-top:24px;line-height:1.8}
/* The reference uses surface contrast, not outlines or elevation, to frame content. */
.phone{box-shadow:none}.phone .metrics{background:var(--surface);border:0;border-radius:var(--feature);padding:22px 12px}.metrics b{font-weight:650}.metrics button+button{border:0}.phone:not(.journal) .feature{background:var(--surface);border-radius:var(--feature);padding:16px}.phone:not(.journal) .feature .landscape{border-radius:var(--radius)}.phone .row{background:var(--surface);border:0;border-radius:var(--feature);padding:16px;margin-bottom:12px}.phone .row img{border-radius:var(--radius)}.phone .tabs{border:0;box-shadow:none}.phone .topbar .icon{background:var(--surface);margin-left:8px}.phone .shortcuts{border:0}.phone .shortcut{background:var(--surface);border:0;border-radius:var(--feature);padding:18px 16px;margin-bottom:12px}.journal .metrics{margin-top:6px}.plan{border:0;padding-top:12px}.plan-image{border-radius:var(--radius)}.primary{border-radius:var(--radius)}
@media(min-width:1500px){.gallery{gap:42px}}@media(max-width:1000px){.studio{padding:18px 20px;flex-wrap:wrap}.tools{flex:1;justify-content:flex-end}.brand span{display:none}.gallery{gap:14px;padding:0 14px 32px}.pad{padding:0 16px}.phone{border-radius:24px}.metrics button{gap:6px}.metrics span{font-size:11px}.profile{gap:10px}.profile h2{font-size:19px}}
@media(max-width:760px){.studio{padding:14px 16px;gap:12px}.brand strong{font-size:19px}.tools{gap:8px}.seg{flex:1;justify-content:space-between}.seg button{padding:0 9px;font-size:11px}.seg button[data-mode="all"]{display:none}.tools{flex-basis:100%}.theme{height:36px;width:36px}.caption{margin:16px auto;padding:0 16px;font-size:10px}.gallery,.gallery.single{display:block;max-width:430px;padding:0 12px 24px}.gallery .variant{display:none}.gallery .variant.chosen{display:block}.variant-label{padding:0 4px}.phone{height:810px;border-radius:24px}.pad{padding:0 20px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .18s,filter .18s}dialog[open]{animation:enter .18s ease-out}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<header class="studio"><div class="brand"><strong>kaipa</strong><span>我的 / 设计提案</span></div><div class="tools"><div class="seg" aria-label="预览方案"><button data-mode="all" class="active" aria-pressed="true">并排对比</button><button data-mode="a" aria-pressed="false">01 个人档案</button><button data-mode="b" aria-pressed="false">02 旅行手记</button><button data-mode="c" aria-pressed="false">03 出发工作台</button></div><button class="icon theme" aria-label="切换深色模式" title="切换深色模式" id="theme"><i data-lucide="moon"></i></button></div></header>
<div class="caption"><span>KAIPA DESIGN STUDY / 01—03</span><span>示例数据 · 配图非实际目的地</span></div>
<main class="gallery" id="gallery"></main>
<dialog id="detail" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon" aria-label="关闭" title="关闭" id="close"><i data-lucide="x"></i></button></div><div class="dialog-body" id="dialog-body"></div></dialog>
<script src="me-preview-assets/lucide.min.js"></script>
<script>
(()=>{
const photo=name=>`me-preview-assets/${name}.jpg`;
const icon=name=>`<i data-lucide="${name}"></i>`;
const action=(name,label)=>`<button class="icon ${name==='bell'?'bell':''}" data-open="${label}" aria-label="${label}" title="${label}">${icon(name)}</button>`;
const top=`<div class="topbar"><h1>我的</h1><div class="actions">${action('bell','消息')}${action('settings-2','设置')}</div></div>`;
const profile=`<button class="profile" data-open="个人资料"><img class="avatar" src="${photo('forest')}" alt="林间头像"><div><h2>山野之间</h2><p>把周末留给山野。</p></div><i class="chev" data-lucide="chevron-right"></i></button>`;
const metrics=`<div class="metrics"><button data-open="我的行程"><b>12</b><span>我的行程</span></button><button data-open="我的收藏"><b>28</b><span>我的收藏</span></button></div>`;
const heading=(title,target=title)=>`<div class="section-head"><h2>${title}</h2><button data-open="${target}">全部 ${icon('arrow-up-right')}</button></div>`;
const meta=`<div class="meta"><span>${icon('calendar-days')}08.23 — 08.24</span><span>${icon('map-pin')}江西 萍乡</span></div>`;
const row=(name,img,sub)=>`<button class="row" data-open="${name}"><img src="${photo(img)}" alt="${img==='forest'?'森林':img==='lake'?'湖泊':'山峰'}示意照片"><div class="row-copy"><h3>${name}</h3><p>${sub}</p></div>${icon('chevron-right')}</button>`;
const feature=`<button class="feature" data-open="武功山，两天一夜"><img class="landscape" src="${photo('mountain')}" alt="山峰示意照片"><div class="feature-copy"><h3>武功山，两天一夜</h3><span class="tag">已结束</span></div>${meta}</button>`;
const tabs=`<nav class="tabs" aria-label="底部导航">${[['compass','发现'],['route','行程'],['backpack','装备'],['user-round','我的']].map(([i,t])=>`<button class="${t==='我的'?'current':''}" ${t==='我的'?'data-home aria-current="page"':`data-open="${t}"`}>${icon(i)}<span>${t}</span></button>`).join('')}</nav><div class="home-indicator"></div>`;
const status=`<div class="status"><span>9:41</span><div class="signals">${icon('signal')}${icon('wifi')}${icon('battery-full')}</div></div>`;
const a=`<div class="pad">${top}${profile}${metrics}${heading('最近行程','我的行程')}${feature}${heading('我的收藏')}${row('湖边的慢周末','lake','湖泊徒步　12.6 km')}${row('走进绿色深处','forest','森林步道　8.2 km')}</div>`;
const b=`<div class="pad">${top}${profile}</div><button class="feature" data-open="武功山，两天一夜"><img class="hero-photo" src="${photo('mountain')}" alt="山峰示意照片"><div class="hero-text pad"><div class="eyebrow">2026.08.23 — 08.24</div><h2>武功山，两天一夜</h2><p>日出之前出发，在山顶等第一束光。</p></div></button><div class="pad">${metrics}${heading('最近记录','我的行程')}<button class="memory" data-open="湖边的慢周末"><time>09<small>08月</small></time><img src="${photo('lake')}" alt="湖泊示意照片"><div><h3>湖边的慢周末</h3><p>两个人，一段不赶路的时光</p></div></button><button class="memory" data-open="走进绿色深处"><time>26<small>07月</small></time><img src="${photo('forest')}" alt="森林示意照片"><div><h3>走进绿色深处</h3><p>收集一个安静的夏天</p></div></button>${heading('我的收藏')}${row('下次去看湖','lake','28 条收藏路线')}</div>`;
const c=`<div class="pad">${top}${profile}<section class="plan"><div class="plan-title"><span>最近筹备</span><span class="tag">筹备中</span></div><h2>下一站，武功山</h2><div class="meta"><span>${icon('map-pin')}江西 萍乡</span><span>${icon('users')}3 人同行</span></div><img class="plan-image" src="${photo('mountain')}" alt="山峰示意照片"><div class="date-grid"><div><small>出发日期</small><strong>09 月 19 日</strong></div><div><small>行程天数</small><strong>2 天 1 夜</strong></div></div><div class="progress-label">行前清单<span id="progress-label">8 / 12</span></div><div class="progress" role="progressbar" aria-label="行前清单" aria-valuenow="8" aria-valuemin="0" aria-valuemax="12"><i></i></div><button class="primary" data-open="行前清单">继续准备 ${icon('arrow-right')}</button></section><div class="shortcuts">${[['route','我的行程','12'],['bookmark','我的收藏','28']].map(([i,t,n])=>`<button class="shortcut" data-open="${t}">${icon(i)}${t}<span>${n}</span>${icon('chevron-right')}</button>`).join('')}</div>${heading('最近记录','我的行程')}${row('湖边的慢周末','lake','08 月 09 日　已结束')}</div>`;
const variants=[['a','01 个人档案','内容优先，克制耐看',a,''],['b','02 旅行手记','照片与记忆',b,'journal'],['c','03 出发工作台','下一次出发',c,'workspace']];
document.getElementById('gallery').innerHTML=variants.map(([id,title,sub,body,cls])=>`<section class="variant ${id==='a'?'chosen':''}" data-variant="${id}"><div class="variant-label"><strong>${title}</strong><span>${sub}</span></div><div class="phone ${cls}">${status}<div class="screen">${body}</div>${tabs}</div></section>`).join('');
const drawIcons=()=>lucide.createIcons();drawIcons();
let currentMode='all';
function setMode(mode){currentMode=mode;document.getElementById('gallery').classList.toggle('single',mode!=='all');document.querySelectorAll('[data-mode]').forEach(b=>{const selected=b.dataset.mode===mode||(mode==='all'&&matchMedia('(max-width:760px)').matches&&b.dataset.mode==='a');b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});document.querySelectorAll('[data-variant]').forEach(v=>v.classList.toggle('chosen',v.dataset.variant===(mode==='all'?'a':mode)));}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));matchMedia('(max-width:760px)').addEventListener('change',()=>setMode(currentMode));setMode('all');
function toggleTheme(){const dark=document.body.classList.toggle('dark');document.getElementById('theme').innerHTML=icon(dark?'sun':'moon');document.getElementById('theme').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式');document.getElementById('theme').title=dark?'切换浅色模式':'切换深色模式';drawIcons();}
document.getElementById('theme').addEventListener('click',toggleTheme);
const dialog=document.getElementById('detail');document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
const packing=['登山包','徒步鞋','速干上衣','冲锋衣','登山杖','头灯','饮用水','路餐','保暖中层','雨衣','充电宝','急救包'].map((name,i)=>({name,checked:i<8}));
function openPage(title){document.getElementById('dialog-title').textContent=title;let content='';
if(title==='我的行程'||title==='行程')content=row('下一站，武功山','mountain','09 月 19 日　筹备中')+row('武功山，两天一夜','mountain','08 月 23 日　已结束')+row('湖边的慢周末','lake','08 月 09 日　已结束')+row('走进绿色深处','forest','07 月 26 日　已结束');
else if(title==='我的收藏'||title==='发现')content=row('湖边的慢周末','lake','湖泊徒步　12.6 km')+row('走进绿色深处','forest','森林步道　8.2 km');
else if(title==='消息')content=`<div class="empty">${icon('bell')}<h3>暂无新消息</h3><p class="muted">行程动态会出现在这里</p></div>`;
else if(title==='设置')content=['个人资料','外观','扫码登录','回收站','关于 Kaipa'].map(t=>`<button class="setting" data-open="${t}">${t}${icon('chevron-right')}</button>`).join('');
else if(title==='个人资料')content=`${profile}<div class="setting">用户名 <span class="muted">@shanye</span></div><div class="setting">简介 <span class="muted">把周末留给山野。</span></div>`;
else if(title==='外观')content=`<button class="setting" data-theme>深色模式 <span>${document.body.classList.contains('dark')?'已开启':'已关闭'}</span></button>`;
else if(title==='行前清单'||title==='装备')content='<p>下一站，武功山</p>'+packing.map((p,i)=>`<label class="checkrow"><input type="checkbox" data-pack="${i}" ${p.checked?'checked':''}><span>${p.name}</span></label>`).join('');
else if(title==='回收站')content=`<div class="empty">${icon('trash-2')}<h3>回收站为空</h3></div>`;
else if(title==='扫码登录')content='<p>设计预览未连接相机或登录服务。</p>';
else if(title==='关于 Kaipa')content='<h2>kaipa</h2><p class="sample-note">我的页面设计预览。独立静态原型，不读取或修改账号数据。照片来源：Unsplash，仅作视觉示意。</p>';
else content=`<img class="landscape" src="${photo(title.includes('湖')?'lake':title.includes('绿')?'forest':'mountain')}" alt="行程示意照片"><h2>${title}</h2><div class="meta"><span>${icon('calendar-days')}2026 年</span><span>${icon('route')}2 天 1 夜</span></div><p style="margin-top:20px">${title.includes('武功山')?'日出之前出发，在山顶等第一束光。':'给自己一段不赶路的时光。'}</p>${title.includes('下一站')?'<button class="primary" data-open="行前清单">行前清单</button>':''}`;
document.getElementById('dialog-body').innerHTML=content;drawIcons();if(!dialog.open)dialog.showModal();document.getElementById('dialog-body').scrollTop=0;}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open)openPage(open.dataset.open);if(e.target.closest('[data-theme]')){toggleTheme();openPage('外观');}const home=e.target.closest('[data-home]');if(home)home.closest('.phone').querySelector('.screen').scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});});
document.addEventListener('change',e=>{if(!e.target.matches('[data-pack]'))return;packing[Number(e.target.dataset.pack)].checked=e.target.checked;const count=packing.filter(p=>p.checked).length;document.getElementById('progress-label').textContent=`${count} / 12`;document.querySelector('.progress').setAttribute('aria-valuenow',count);document.querySelector('.progress i').style.width=`${count/12*100}%`;});
})();
</script>
</body>
