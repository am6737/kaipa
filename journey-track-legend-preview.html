<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>旅程详情 · 多路线轨迹预览</title>
  <style>
    :root { color-scheme: light; --bg:#f6f6f4; --surface:#fff; --surface-2:#f0f1ef; --muted:#747872; --text:#191b19; --line:rgba(25,29,26,.11); --accent:#127f78; --blue:#26a9d4; --orange:#e7833f; --purple:#7066d8; --green:#35a970; --shadow:0 18px 48px rgba(25,30,26,.14); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#dfe6e1; color:var(--text); } button { font:inherit; color:inherit; }
    .stage { min-height:100vh; display:grid; place-items:center; padding:24px; } .phone { width:min(430px,100%); height:min(880px,calc(100vh - 48px)); min-height:650px; overflow:hidden; position:relative; border:1px solid var(--line); border-radius:24px; background:var(--bg); box-shadow:var(--shadow); }
    .app { height:100%; display:grid; grid-template-rows:auto 1fr; } .top { padding:18px 18px 12px; background:rgba(246,246,244,.94); backdrop-filter:blur(16px); z-index:2; } .nav { display:grid; grid-template-columns:38px 1fr 38px; align-items:center; height:38px; } .nav h1 { margin:0; text-align:center; font-size:17px; letter-spacing:0; } .icon { width:36px; height:36px; border:0; border-radius:50%; background:transparent; cursor:pointer; font-size:23px; } .icon:hover { background:var(--surface-2); }
    .content { overflow:auto; padding:12px 18px 34px; scrollbar-width:none; } .content::-webkit-scrollbar { display:none; } .eyebrow { margin:9px 2px 4px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.4px; } .title { margin:0 2px; font-size:27px; line-height:1.18; letter-spacing:-.4px; } .sub { margin:7px 2px 16px; color:var(--muted); font-size:13px; }
    .map { height:365px; overflow:hidden; position:relative; border:1px solid var(--line); border-radius:18px; background:#d9e8df; box-shadow:0 3px 12px rgba(38,67,49,.06); } .map:before { content:""; position:absolute; inset:-15%; opacity:.7; transform:rotate(-8deg); background-image:linear-gradient(25deg,transparent 47%,rgba(255,255,255,.72) 48%,rgba(255,255,255,.72) 49%,transparent 50%),linear-gradient(110deg,transparent 47%,rgba(184,204,190,.7) 48%,rgba(184,204,190,.7) 49%,transparent 50%); background-size:125px 102px,170px 130px; } .map svg { position:absolute; inset:0; width:100%; height:100%; } .map-label { position:absolute; padding:5px 7px; border-radius:6px; background:rgba(255,255,255,.86); color:#526159; font-size:10px; font-weight:700; box-shadow:0 2px 7px rgba(38,67,49,.13); }
    .map-tools { position:absolute; right:10px; top:10px; display:grid; gap:7px; } .tool { width:34px; height:34px; border:1px solid rgba(0,0,0,.08); border-radius:9px; background:rgba(255,255,255,.92); cursor:pointer; font-size:18px; box-shadow:0 3px 9px rgba(0,0,0,.1); } .tool.active { color:var(--accent); }
    .route-count { position:absolute; left:10px; top:10px; padding:7px 9px; border-radius:7px; background:rgba(255,255,255,.9); color:#526159; font-size:11px; font-weight:750; box-shadow:0 3px 9px rgba(0,0,0,.09); }
    .route-toggle { position:absolute; left:10px; top:51px; z-index:2; display:flex; align-items:center; gap:6px; height:35px; padding:0 10px; border:1px solid rgba(0,0,0,.08); border-radius:10px; background:rgba(255,255,255,.94); color:#34463b; cursor:pointer; font-size:11px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.09); }
    .route-toggle.active { color:var(--accent); border-color:#9bc8c0; }
    .legend { position:absolute; left:10px; right:10px; bottom:10px; padding:10px 11px; border:1px solid rgba(0,0,0,.07); border-radius:12px; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); transition:opacity .18s, transform .18s; } .legend.closed { opacity:0; pointer-events:none; transform:translateY(8px); } .legend-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:11px; font-weight:800; } .legend-head span { color:var(--muted); font-weight:600; } .chips { display:flex; gap:6px; overflow:auto; scrollbar-width:none; } .chips::-webkit-scrollbar { display:none; } .chip { flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:29px; padding:0 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); cursor:pointer; font-size:11px; font-weight:700; white-space:nowrap; } .chip.active { border-color:currentColor; background:var(--surface); box-shadow:0 2px 7px rgba(0,0,0,.08); } .dot { width:8px; height:8px; border-radius:50%; }
    .map path { transition:opacity .2s,stroke-width .2s; } .route-line { fill:none; stroke-linecap:round; stroke-linejoin:round; } .route-line.dim { opacity:.18; } .route-line.active { opacity:1; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; margin:19px 2px 9px; } .section-head h2 { margin:0; font-size:15px; } .section-head span { color:var(--muted); font-size:11px; } .route-list { display:grid; gap:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--surface); } .route-row { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; min-height:63px; padding:10px 12px; border:0; border-bottom:1px solid var(--line); background:var(--surface); cursor:pointer; text-align:left; } .route-row:last-child { border-bottom:0; } .route-row:hover { background:var(--surface-2); } .route-row.selected { background:rgba(18,127,120,.06); } .route-index { width:25px; height:25px; display:grid; place-items:center; border-radius:8px; color:#fff; font-size:11px; font-weight:850; } .route-name { font-size:13px; font-weight:800; } .route-meta { margin-top:4px; color:var(--muted); font-size:11px; } .chev { color:#9ba6a0; font-size:17px; } .hint { margin:12px 2px 0; color:var(--muted); font-size:11px; line-height:1.4; }
    @media(max-width:520px) { .stage { padding:0; } .phone { width:100%; height:100vh; min-height:560px; border:0; border-radius:0; box-shadow:none; } }
  </style>
</head>
<body>
  <main class="stage"><section class="phone" aria-label="旅程详情多路线轨迹预览"><div class="app">
    <header class="top"><div class="nav"><button class="icon" aria-label="返回">‹</button><h1>旅程详情</h1><button class="icon" aria-label="更多">•••</button></div></header>
    <div class="content"><div class="eyebrow">8 天 · 3 条路线</div><h2 class="title">川西三线秋日之旅</h2><p class="sub">点击地图图例或下方路线，可聚焦查看对应轨迹</p>
      <section class="map" aria-label="多路线地图"><div class="route-count" id="routeCount">显示全部 3 条路线</div><button class="route-toggle" id="routeToggle" aria-expanded="false">☷ 路线</button><div class="map-tools"><button class="tool" id="fit" title="查看全部路线">⌖</button><button class="tool" id="all" title="显示全部路线">⊙</button></div>
        <svg viewBox="0 0 398 365" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 270 C60 210 65 80 148 112 S211 288 274 226 S343 110 420 132" fill="none" stroke="#b6cbbb" stroke-width="15" opacity=".7"/><path d="M-20 270 C60 210 65 80 148 112 S211 288 274 226 S343 110 420 132" fill="none" stroke="#fff" stroke-width="6" opacity=".75"/><path id="r1" class="route-line active" d="M22 297 C61 252 77 213 102 186 S139 116 168 132 S207 205 237 218 S285 204 315 146" stroke="var(--blue)" stroke-width="6"/><path id="r2" class="route-line active" d="M66 286 C105 260 123 224 150 238 S192 294 223 275 S267 192 291 176 S333 167 371 96" stroke="var(--orange)" stroke-width="6"/><path id="r3" class="route-line active" d="M57 323 C89 302 111 298 142 315 S192 339 220 305 S264 252 279 224 S315 198 349 208" stroke="var(--purple)" stroke-width="6"/><circle cx="22" cy="297" r="6" fill="#fff" stroke="var(--blue)" stroke-width="4"/><circle cx="371" cy="96" r="6" fill="#fff" stroke="var(--orange)" stroke-width="4"/><circle cx="349" cy="208" r="6" fill="#fff" stroke="var(--purple)" stroke-width="4"/></svg>
        <span class="map-label" style="left:8%;top:78%">新都桥</span><span class="map-label" style="left:74%;top:23%">冷嘎措</span><span class="map-label" style="left:68%;top:59%">贡嘎雪山</span>
        <div class="legend closed" id="legend"><div class="legend-head">路线图例 <span id="legendHint">点击可单独查看</span></div><div class="chips" id="chips"></div></div>
      </section>
      <div class="section-head"><h2>路线与行程</h2><span id="selectedText">全部路线</span></div><div class="route-list" id="routes"></div><p class="hint">选中路线后，其他轨迹会自动淡化；再次点击当前路线或“全部”，恢复总览。</p>
    </div>
  </div></section></main>
  <script>
    const routes=[{id:'r1',n:'贡嘎环线',d:'第 1–3 天 · 42.6 km',c:'#26b7e8'},{id:'r2',n:'冷嘎措观景线',d:'第 4–5 天 · 18.4 km',c:'#ff914d'},{id:'r3',n:'新都桥森林线',d:'第 6–8 天 · 27.1 km',c:'#6c63f5'}];
    let selected='all'; const chips=document.querySelector('#chips'), list=document.querySelector('#routes');
    function render(){ chips.innerHTML='<button class="chip '+(selected==='all'?'active':'')+'" data-id="all">全部 3 条</button>'+routes.map((r,i)=>'<button class="chip '+(selected===r.id?'active':'')+'" data-id="'+r.id+'"><i class="dot" style="background:'+r.c+'"></i>'+ (i+1)+' '+r.n+'</button>').join(''); list.innerHTML=routes.map((r,i)=>'<button class="route-row '+(selected===r.id?'selected':'')+'" data-id="'+r.id+'"><i class="route-index" style="background:'+r.c+'">'+(i+1)+'</i><span><span class="route-name">'+r.n+'</span><span class="route-meta">'+r.d+'</span></span><b class="chev">›</b></button>').join(''); document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>select(el.dataset.id)); routes.forEach(r=>{const el=document.getElementById(r.id); if(el) {el.classList.toggle('dim',selected!=='all'&&selected!==r.id);el.classList.toggle('active',selected==='all'||selected===r.id);}}); document.querySelector('#routeCount').textContent=selected==='all'?'显示全部 3 条路线':'正在查看：'+routes.find(r=>r.id===selected).n; document.querySelector('#selectedText').textContent=selected==='all'?'全部路线':routes.find(r=>r.id===selected).n; }
    function select(id){selected=id;render();} document.querySelector('#all').onclick=()=>select('all'); document.querySelector('#fit').onclick=()=>{select('all'); document.querySelector('#legendHint').textContent='已回到总览'; setTimeout(()=>document.querySelector('#legendHint').textContent='点击可单独查看',1400);}; document.querySelector('#routeToggle').onclick=()=>{const legend=document.querySelector('#legend'); const open=legend.classList.toggle('closed'); document.querySelector('#routeToggle').classList.toggle('active',!open); document.querySelector('#routeToggle').setAttribute('aria-expanded',String(!open));}; render();
  </script>
</body>
</html>
