# Production overlay for a dedicated Kaipa server.
#
# The base stack publishes Kong (HTTP + HTTPS) and the Postgres pooler on every
# interface, which is what the coder workspace's port forwarding needs. On a
# public server only a host reverse proxy should reach Kong, and the database
# should not be reachable at all from outside. `!override` replaces the base
# port lists instead of appending to them (Compose >= 2.24).
#
# infra/server/deploy.sh installs this file into the runtime directory and puts
# it on COMPOSE_FILE; the sibling deploy-*.sh scripts layer it whenever the
# runtime copy exists, so recreating `functions` (which depends on kong) never
# rebinds Kong to 0.0.0.0.
services:
  kong:
    ports: !override
      - 127.0.0.1:${KONG_HTTP_PORT}:8000/tcp
  supavisor:
    ports: !override
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543
