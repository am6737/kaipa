<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路线起点聚合预览</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211d; background: #e9eee9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .frame { width: min(1100px, 100%); height: min(760px, calc(100vh - 48px)); min-height: 560px; overflow: hidden; position: relative; border: 1px solid #c9d3cc; border-radius: 18px; background: #dce7dc; box-shadow: 0 18px 50px rgba(28, 52, 38, .18); }
    .map { position: absolute; inset: 0; overflow: hidden; background: #dce7dc; }
    .map:before { content: ""; position: absolute; inset: -20%; background-image: linear-gradient(28deg, transparent 47%, rgba(255,255,255,.7) 48%, rgba(255,255,255,.7) 49%, transparent 50%), linear-gradient(112deg, transparent 46%, rgba(197,211,198,.95) 47%, rgba(197,211,198,.95) 48%, transparent 49%); background-size: 220px 180px, 260px 220px; transform: rotate(-8deg); opacity: .85; }
    .water { position: absolute; width: 55%; height: 38%; right: -8%; top: -7%; border-radius: 50%; background: #b9d8dc; transform: rotate(18deg); opacity: .9; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .65; }
    .topbar { position: absolute; left: 22px; top: 20px; z-index: 5; display: flex; align-items: center; gap: 12px; }
    .title { padding: 10px 14px; border: 1px solid rgba(255,255,255,.8); border-radius: 10px; background: rgba(255,255,255,.88); box-shadow: 0 4px 14px rgba(42, 62, 47, .12); font-size: 14px; font-weight: 750; }
    .hint { color: #52645a; font-size: 12px; }
    .controls { position: absolute; right: 22px; top: 20px; z-index: 5; display: grid; gap: 8px; }
    button { border: 1px solid #ccd6ce; background: rgba(255,255,255,.94); color: #24352a; cursor: pointer; font: inherit; box-shadow: 0 4px 12px rgba(42,62,47,.12); }
    .zoom { width: 38px; height: 38px; border-radius: 9px; font-size: 22px; line-height: 1; }
    .zoom:active, .cluster:active, .pin:active { transform: scale(.96); }
    .legend { position: absolute; left: 22px; bottom: 22px; z-index: 5; padding: 12px 14px; border: 1px solid rgba(255,255,255,.8); border-radius: 10px; background: rgba(255,255,255,.9); color: #52645a; font-size: 12px; box-shadow: 0 4px 14px rgba(42,62,47,.12); }
    .legend strong { color: #24352a; }
    .marker-layer { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform .35s ease; }
    .pin, .cluster { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; transition: left .35s ease, top .35s ease, transform .2s ease, opacity .2s ease; }
    .pin { width: 48px; height: 48px; padding: 0; border-radius: 14px; border: 3px solid #fff; background: #497d61; color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 5px 13px rgba(26,65,43,.28); }
    .pin span { display: block; width: 100%; padding: 3px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(14,46,29,.7); border-radius: 0 0 10px 10px; }
    .toast { position: absolute; left: 50%; bottom: 24px; z-index: 6; transform: translate(-50%, 20px); padding: 10px 15px; border-radius: 9px; background: #173a29; color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 640px) { body { padding: 0; } .frame { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; } .hint { display: none; } }
  </style>
</head>
<body>
  <main class="frame" aria-label="路线起点聚合预览">
    <section class="map">
      <div class="water"></div>
      <svg viewBox="0 0 1100 760" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-40 470 C170 300 260 520 450 370 S760 250 1140 410" fill="none" stroke="#b1c3b2" stroke-width="16" stroke-linecap="round"/>
        <path d="M-40 470 C170 300 260 520 450 370 S760 250 1140 410" fill="none" stroke="#f8fbf6" stroke-width="7" stroke-linecap="round"/>
        <path d="M60 110 C300 210 380 90 600 220 S850 520 1140 550" fill="none" stroke="#c0cdbd" stroke-width="11" stroke-linecap="round"/>
        <path d="M60 110 C300 210 380 90 600 220 S850 520 1140 550" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="topbar"><div class="title">路线起点防重叠预览</div><div class="hint">所有路线始终可见，近距离起点会错位展开</div></div>
      <div class="controls"><button class="zoom" id="plus" aria-label="放大">+</button><button class="zoom" id="minus" aria-label="缩小">−</button></div>
      <div class="marker-layer" id="markers"></div>
      <div class="legend"><strong id="zoomLabel">缩放级别 1</strong><br>近距离起点会轻微错位，点击即可查看路线</div>
      <div class="toast" id="toast"></div>
    </section>
  </main>
  <script>
    const routes = [
      [24, 31, '云台山'], [27, 34, '红石峡'], [30, 29, '太行脊'], [33, 35, '泉瀑线'],
      [64, 62, '西岭雪山'], [68, 65, '日照金山'], [71, 59, '冷嘎措'],
      [82, 25, '海岸步道'], [86, 29, '灯塔线'], [89, 26, '礁石湾'],
      [48, 75, '森林环线'], [52, 78, '溪谷入口'], [76, 78, '北坡古道']
    ];
    const layer = document.getElementById('markers');
    const toast = document.getElementById('toast');
    const zoomLabel = document.getElementById('zoomLabel');
    let zoom = 1;
    function spread() {
      const groups = [];
      routes.forEach(route => {
        const group = groups.find(g => Math.hypot(g.x - route[0], g.y - route[1]) < 6);
        if (group) group.items.push(route); else groups.push({ x: route[0], y: route[1], items: [route] });
      });
      return groups.flatMap(group => group.items.map((route, index) => {
        if (group.items.length === 1) return { route, x: route[0], y: route[1] };
        const angle = index * Math.PI * 2 / group.items.length - Math.PI / 2;
        const distance = zoom === 1 ? 7.5 : zoom === 2 ? 5.2 : zoom === 3 ? 3.5 : 2.2;
        return { route, x: group.x + Math.cos(angle) * distance, y: group.y + Math.sin(angle) * distance };
      }));
    }
    function render() {
      layer.innerHTML = '';
      spread().forEach(item => {
          const el = document.createElement('button'); el.className = 'pin'; el.style.left = item.x + '%'; el.style.top = item.y + '%';
          el.innerHTML = '<span>' + item.route[2] + '</span>';
          el.onclick = () => notice('已选择：' + item.route[2]);
          layer.appendChild(el);
      });
      zoomLabel.textContent = '缩放级别 ' + zoom;
    }
    function notice(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1600); }
    document.getElementById('plus').onclick = () => { zoom = Math.min(4, zoom + 1); render(); };
    document.getElementById('minus').onclick = () => { zoom = Math.max(1, zoom - 1); render(); };
    render();
  </script>
</body>
</html>
