<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>再添加一个地点 布局对比</title>
<style>
  :root {
    --bg: #E9E9EC; --grouped: #F2F2F4; --surface: #FFFFFF; --field: rgba(0,0,0,0.045);
    --text: #111113; --text2: rgba(60,60,67,0.62); --text3: rgba(60,60,67,0.32);
    --accent: #2DB65C; --frameEdge: #D4D4D8; --note: #6B6B70;
  }
  body.dark {
    --bg: #0B0B0C; --grouped: #1C1C1E; --surface: #2C2C2E; --field: rgba(255,255,255,0.07);
    --text: #FFFFFF; --text2: rgba(235,235,245,0.62); --text3: rgba(235,235,245,0.30);
    --frameEdge: #2C2C2E; --note: #9A9AA0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; padding: 28px 24px 48px; }
  header.page { max-width: 1160px; margin: 0 auto 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header.page h1 { font-size: 22px; font-weight: 800; }
  header.page p { font-size: 13px; color: var(--note); margin-top: 6px; line-height: 1.6; max-width: 760px; }
  .toggle { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 700; background: var(--surface); color: var(--text); cursor: pointer; }
  .row { max-width: 1160px; margin: 0 auto; display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .col { width: 340px; }
  .cap { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .capnote { font-size: 12px; color: var(--note); line-height: 1.6; margin-bottom: 12px; min-height: 76px; }
  .phone { width: 340px; height: 720px; border-radius: 44px; border: 8px solid var(--frameEdge); background: var(--grouped); position: relative; overflow: hidden; }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 700; }
  .nav { height: 44px; position: relative; display: flex; align-items: center; padding: 0 10px; }
  .nav .x { width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; }
  .nav .t { position: absolute; left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 700; pointer-events: none; }
  .body { padding: 22px 14px 150px; height: calc(100% - 88px); overflow-y: auto; scrollbar-width: none; }
  .body::-webkit-scrollbar { display: none; }
  .q { font-size: 23px; font-weight: 800; line-height: 1.3; }
  .gap { height: 34px; }
  .card { margin-top: 14px; border-radius: 24px; background: var(--surface); padding: 18px 16px 16px; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .card .name { font-size: 16px; font-weight: 800; }
  .card .x { color: var(--text3); font-size: 15px; }
  .card .region { font-size: 12px; color: var(--text2); margin-top: 10px; }
  .stats { display: flex; gap: 34px; margin-top: 14px; }
  .stat b { font-size: 21px; font-weight: 700; }
  .stat small { font-size: 11px; color: var(--text2); margin-left: 3px; }
  .stat div { font-size: 11.5px; color: var(--text2); margin-top: 3px; }
  .search { margin-top: 8px; height: 52px; border-radius: 24px; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; color: var(--text3); }
  .search.focus { color: var(--text); }
  .search .ic { color: var(--text2); font-size: 15px; }
  .caret { width: 2px; height: 20px; background: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .addlink { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 2px; font-size: 14px; font-weight: 700; color: var(--accent); cursor: pointer; user-select: none; }
  .addlink .plus { font-size: 17px; line-height: 1; }
  .cancel { font-size: 14px; font-weight: 600; color: var(--text2); cursor: pointer; padding-left: 4px; }
  .field { margin-top: 12px; height: 52px; border-radius: 24px; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .field b { flex: 1; font-size: 15px; font-weight: 700; }
  .chev { color: var(--text3); font-size: 15px; }
  .track { margin-top: 12px; display: flex; align-items: center; }
  .track b { flex: 1; font-size: 15px; font-weight: 700; }
  .track span { font-size: 14px; font-weight: 700; color: var(--accent); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px 22px; background: var(--grouped); }
  .btns { display: flex; gap: 10px; }
  .btn { flex: 1; height: 50px; border-radius: 25px; display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  .btn.ai { background: var(--surface); color: var(--text); }
  .btn.go { background: var(--accent); color: #fff; }
  .barhint { text-align: center; font-size: 11px; color: var(--text2); margin-top: 8px; }
  .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 236px; background: #D1D3D9; display: none; z-index: 5; }
  body.dark .kb { background: #2B2B2E; }
  .kb .keys { padding: 10px 4px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 7px 5px; }
  .kb .keys i { height: 38px; border-radius: 6px; background: rgba(255,255,255,0.9); display: block; }
  body.dark .kb .keys i { background: #5A5A5E; }
  .phone.typing .kb { display: block; }
  .phone.typing .bar { display: none; }
  .results { margin-top: 4px; }
  .res { padding: 10px 4px; font-size: 14px; }
  .res small { display: block; font-size: 11.5px; color: var(--text2); margin-top: 2px; }
</style>
</head>
<body>
<header class="page">
  <div>
    <h1>「再添加一个地点」三种布局</h1>
    <p>以截图里的「阿布吉措」为例。B 可以点「＋ 再添加一个地点」试一下：会展开成搜索框和键盘，点「取消」或某个结果收回。</p>
  </div>
  <button class="toggle" onclick="document.body.classList.toggle('dark')">切换深色</button>
</header>

<div class="row">
  <div class="col">
    <div class="cap">现状：卡片在上，大搜索框在下</div>
    <div class="capnote">已加 8pt 间距。搜索框和卡片同样宽、同样白、同样分量，低频操作和主内容抢视线。</div>
    <div class="phone" data-variant="now"></div>
  </div>
  <div class="col">
    <div class="cap">A：大搜索框移到卡片上面</div>
    <div class="capnote">问题之后先是输入框、再是答案；新加的地点会出现在输入框下面、路线卡片上面或下面，顺序都别扭。搜索结果会把卡片挤下去。</div>
    <div class="phone" data-variant="top"></div>
  </div>
  <div class="col">
    <div class="cap">B：卡片在上，入口降级成一行字（建议）</div>
    <div class="capnote">平时只占一行。点一下原地变成搜索框并弹出键盘，结果往下展开；取消或选完后收回成一行字。</div>
    <div class="phone" data-variant="link"></div>
  </div>
</div>

<script>
const card = `
  <div class="card">
    <div class="top"><span class="name">阿布吉措</span><span class="x">✕</span></div>
    <div class="region">云南 迪庆</div>
    <div class="stats">
      <div class="stat"><b>27.2</b><small>km</small><div>距离</div></div>
      <div class="stat"><b>1111</b><small>m</small><div>累计爬升</div></div>
      <div class="stat"><b>1-2</b><small>天</small><div>徒步天数</div></div>
    </div>
  </div>`;
const bigSearch = `<div class="search"><span class="ic">⌕</span>再添加一个地点</div>`;
const rest = `
  <div class="gap"></div>
  <div class="q">什么时候出发？</div>
  <div class="field">▦ <b>暂不确定</b><span class="chev">›</span></div>
  <div class="gap"></div>
  <div class="q">轨迹</div>
  <div class="track"><b>已带路线轨迹</b><span>更换</span></div>`;
const bar = `
  <div class="bar">
    <div class="btns"><div class="btn ai">AI 起草</div><div class="btn go">创建旅程</div></div>
    <div class="barhint">AI 草案需要自己核对，可在旅程里随时修改</div>
  </div>
  <div class="kb"><div class="keys">${'<i></i>'.repeat(30)}</div></div>`;
const chrome = inner => `
  <div class="status"><span>18:53</span><span>●●● 34</span></div>
  <div class="nav"><div class="x">✕</div><div class="t">创建旅程</div></div>
  <div class="body"><div class="q">想去哪里？</div>${inner}${rest}</div>${bar}`;

const addCollapsed = `<div class="addlink" data-open><span class="plus">＋</span>再添加一个地点</div>`;
const addOpen = `
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
    <div class="search focus" style="flex:1;margin-top:0"><span class="ic">⌕</span>丽江<span class="caret"></span></div>
    <span class="cancel" data-close>取消</span>
  </div>
  <div class="results">
    <div class="res">丽江古城<small>云南 丽江</small></div>
    <div class="res">丽江 玉龙雪山<small>云南 丽江</small></div>
  </div>`;

document.querySelector('[data-variant="now"]').innerHTML = chrome(card + bigSearch);
document.querySelector('[data-variant="top"]').innerHTML = chrome(`<div style="margin-top:14px"></div>${bigSearch.replace('margin-top: 8px', '')}`.replace('class="search"', 'class="search" style="margin-top:0"') + card.replace('margin-top: 14px', '').replace('class="card"', 'class="card" style="margin-top:8px"'));

const link = document.querySelector('[data-variant="link"]');
function renderLink(open) {
  link.innerHTML = chrome(card + (open ? addOpen : addCollapsed));
  link.classList.toggle('typing', open);
  const o = link.querySelector('[data-open]'); if (o) o.onclick = () => renderLink(true);
  const c = link.querySelector('[data-close]'); if (c) c.onclick = () => renderLink(false);
  link.querySelectorAll('.res').forEach(r => r.onclick = () => renderLink(false));
}
renderLink(false);
</script>
</body>
</html>
