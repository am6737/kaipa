<body><main class="layout"><aside class="intro"><div class="brand">kaipa<span style="color:#a1a6ae;font-weight:400"> / 交互预览</span></div><div class="eyebrow">路线 · 添加地点</div><h1>沿用路线详情，<br>让取点更自然。</h1><p id="description">全屏地图用手势缩放。密集标注合并为数量，放大后再看清每个点。</p><div class="steps"><div><span>01</span><b>用手势缩放，地图更清爽</b><small>删除缩放与定位按钮，返回只保留箭头。</small></div><div><span>02</span><b>密集标注按区域合并数量</b><small>缩小时显示数量，放大后逐步展开。</small></div><div><span>03</span><b>路线与选点信息集中在底部</b><small>紧凑确认卡，减少地图上的浮动装饰。</small></div></div><p class="note">交互示意：可拖动地图、双指或滚轮缩放、点击数量展开标注、搜索列表并确认。<br>地图与地点均为示意；正式实现沿用当前路线地图及其地图样式。</p><button class="reset" id="reset">重置当前预览</button></aside>

<script>
const points=[{name:'龙山村',km:0,ele:520,x:89,y:603},{name:'发云界',km:5.2,ele:1620,x:115,y:446},{name:'好汉坡',km:9.6,ele:1580,x:238,y:417},{name:'绝望坡',km:12.8,ele:1690,x:179,y:329},{name:'吊马桩',km:17.3,ele:1760,x:281,y:291},{name:'金顶',km:21.6,ele:1918,x:202,y:186}];

const originalPoints=[...points];originalPoints.forEach((p,j)=>{for(let i=1;i<=9;i++){const d=(i-5)*4.5;points.push({name:'路段标注 '+(j+1)+'-'+i,km:Math.max(0,p.km+d/100),ele:p.ele,x:p.x+d*.45,y:p.y+d});}});points.sort((a,b)=>a.km-b.km);

let contours='';for(let i=0;i<23;i++){const x=25+i*19,y=195+i*7;contours+=`<path class="contour" d="M${x-230} ${y-245} C${x+225} ${y-195} ${x+290} ${y+180} ${x+10} ${y+320} S${x-265} ${y+310} ${x-230} ${y-245}Z"/>`;}$('#terrain').innerHTML=contours;
function render(){phone.dataset.v=variant;phone.classList.toggle('expanded',expanded);document.querySelectorAll('.variant').forEach(b=>b.classList.toggle('active',b.dataset.version===variant));$('#description').textContent={a:'全屏地图用手势缩放。密集标注合并为数量，放大后再看清每个点。',b:'把标注点列表常驻在地图下方。沿路线顺序查看里程和海拔，点列表即可定位；也能切到地图选点。',c:'全屏地图用手势缩放。密集标注合并为数量，放大后再看清每个点。'}[variant];$('#expand').textContent=expanded?'收起 ⌄':'查看全部 ⌃';renderPins();$('#chips').innerHTML=points.map((p,i)=>`<button class="chip ${selected?.index===i?'selected':''}" data-index="${i}">${i+1} &nbsp;${p.name}</button>`).join('');renderRows();$('#selectedName').textContent=selected?.name||'还未选择地点';$('#selectedMeta').textContent=selected?`距起点 ${selected.km.toFixed(1)} km${selected.ele!=null?' · 海拔 '+selected.ele+' m':''}`:'点轨迹取点，或从全部标注中选择';$('#selectedCheck').textContent=selected?'✓':'';$('.selected-info').classList.toggle('has-point',!!selected);$('#confirm').disabled=!selected;$('#tabAll').classList.toggle('active',!mapOnly);$('#tabMap').classList.toggle('active',mapOnly);if(variant==='b'){$('#rows').style.display=mapOnly?'none':'';$('.search').style.display=mapOnly?'none':'';$('.sheet').style.height=mapOnly?'208px':'';map.style.bottom=mapOnly?'70px':'';}else{$('#rows').style.display='';$('.search').style.display='';$('.sheet').style.height='';map.style.bottom='';}updateTransform();}
function renderPins(){const groups=[];points.forEach((p,i)=>{let group=groups.find(g=>Math.hypot((p.x-g.anchor.x)*zoom,(p.y-g.anchor.y)*zoom)<=52);if(group)group.indices.push(i);else groups.push({anchor:p,indices:[i]});});$('#pins').innerHTML=groups.map(g=>{if(g.indices.length>1){const avg=g.indices.reduce((a,i)=>({x:a.x+points[i].x/g.indices.length,y:a.y+points[i].y/g.indices.length}),{x:0,y:0});const p=points[g.indices.reduce((best,i)=>Math.hypot(points[i].x-avg.x,points[i].y-avg.y)<Math.hypot(points[best].x-avg.x,points[best].y-avg.y)?i:best,g.indices[0])];return `<g class="pin cluster" data-cluster="true" data-x="${p.x}" data-y="${p.y}" transform="translate(${p.x} ${p.y})"><line y1="-6" y2="0"/><circle cy="-21" r="15"/><text y="-17" text-anchor="middle">${g.indices.length}</text></g>`;}const i=g.indices[0],p=points[i];return `<g class="pin ${selected?.index===i?'selected':''}" data-index="${i}" transform="translate(${p.x} ${p.y})"><circle r="10"/><text text-anchor="middle" dy="3.5">${i+1}</text></g>`;}).join('');if(selected?.index!=null){const p=selected;$('#pins').innerHTML+=`<g class="pin selected" data-index="${selected.index}" transform="translate(${p.x} ${p.y})"><circle class="halo" r="19"/><circle r="12"/><text text-anchor="middle" dy="3.5">${selected.index+1}</text></g>`;}$('.sheet-head small').textContent=points.length+' 个';$('#floatingList span').textContent=points.length+' ›';}
document.addEventListener('click',e=>{const g=e.target.closest('[data-cluster]');if(g){zoom=Math.min(8,zoom*2);tx=(195-Number(g.dataset.x))*zoom;ty=(350-Number(g.dataset.y))*zoom;updateTransform();}});
function renderRows(){const query=$('#search').value.trim();$('#rows').innerHTML=points.map((p,i)=>({p,i})).filter(({p})=>p.name.includes(query)).map(({p,i})=>`<button class="row ${selected?.index===i?'selected':''}" data-index="${i}"><span class="order">${i+1}</span><span class="text"><b>${p.name}</b><small>距起点 ${p.km.toFixed(1)} km · 海拔 ${p.ele} m</small></span><span class="tick">${selected?.index===i?'✓':''}</span></button>`).join('')||'<div class="empty">没有匹配的标注点</div>';}
function pick(index,focus=true){selected={...points[index],index};$('#customPin').style.display='none';if(focus){zoom=Math.max(zoom,1.2);tx=(195-selected.x)*zoom;ty=(350-selected.y)*zoom;}if(variant==='c')expanded=false;render();}
function updateTransform(){renderPins();world.setAttribute('transform',`translate(${195+tx} ${390+ty}) scale(${zoom}) translate(-195 -390)`);$('#scaleText').textContent=Math.round(500/zoom)+' m';}
function zoomBy(factor){zoom=Math.min(8,Math.max(.65,zoom*factor));updateTransform();}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',2500);}
function reset(){selected=null;expanded=false;zoom=variant==='a'?.85:variant==='c'?.9:1;tx=0;ty=variant==='a'?-45:variant==='c'?-30:0;mapOnly=false;$('#search').value='';$('#customPin').style.display='none';render();}
document.querySelectorAll('.variant').forEach(b=>b.onclick=()=>{variant=b.dataset.version;reset();});['#expand','#handle','#floatingList'].forEach(s=>$(s).onclick=()=>{expanded=!expanded;render();});$('#reset').onclick=reset;$('#search').oninput=renderRows;$('#tabAll').onclick=()=>{mapOnly=false;render();};$('#tabMap').onclick=()=>{mapOnly=true;render();};$('#confirm').onclick=()=>selected&&toast('已选择「'+selected.name+'」 · 返回添加行程');$('#back').onclick=()=>toast('返回添加地点 · 预览');$('#routeSwitch').onclick=()=>toast('当前示例仅包含一条轨迹');document.addEventListener('click',e=>{const el=e.target.closest('[data-index]');if(el)pick(Number(el.dataset.index),!el.classList.contains('pin'));});
function svgPosition(x,y){const pt=$('#mapSvg').createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(world.getScreenCTM().inverse());}
function selectOnLine(e){const p=svgPosition(e.clientX,e.clientY);let best=null;for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy)));const x=a[0]+t*dx,y=a[1]+t*dy,d=Math.hypot(p.x-x,p.y-y);if(!best||d<best.d)best={x,y,d,i,t};}if(best.d>30/zoom){toast('请点一下蓝色轨迹上的位置');return;}const km=(best.i+best.t)/(route.length-1)*21.6;selected={name:'距起点 '+km.toFixed(1)+' km',km,x:best.x,y:best.y};$('#customPin').style.display='';$('#customPin').setAttribute('transform',`translate(${best.x} ${best.y})`);render();}
const pointers=new Map();let start=null,moved=false,pinchDistance=0;
map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.target.closest('.pin'))return;map.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,tx,ty};moved=false;if(pointers.size===2){const p=[...pointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);moved=true;}});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance)zoomBy(dist/pinchDistance);pinchDistance=dist;moved=true;}else if(start){const rect=$('#mapSvg').getBoundingClientRect(),factor=Math.max(390/rect.width,820/rect.height);const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)moved=true;tx=start.tx+dx*factor;ty=start.ty+dy*factor;updateTransform();}});
map.addEventListener('pointerup',e=>{if(!moved&&!e.target.closest('.pin'))selectOnLine(e);pointers.delete(e.pointerId);start=null;pinchDistance=0;});map.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);start=null;});map.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1);},{passive:false});render();
</script></body></html>
