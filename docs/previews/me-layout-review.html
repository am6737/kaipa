    body { margin: 0; background: #e9edf0; color: #242728; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .review-bar { max-width: 850px; margin: 0 auto; padding: 24px 20px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    .caption { font-size: 12px; font-weight: 500; color: #737b80; margin: 12px 0; }

    .status-icons { display: flex; gap: 5px; }
    .status-icons svg { width: 15px; height: 15px; stroke-width: 2; }

    .tool { width: 44px; height: 44px; display: grid; place-items: center; }

    .identity { text-align: center; padding: 14px 20px 28px; }

    .content { padding: 0 20px 128px; }

    .tile-head > svg { width: 22px; height: 22px; stroke-width: 1.7; color: var(--icon); }

    .entry-icon { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; background: var(--icon-bg); color: var(--icon); display: grid; place-items: center; }
    .entry-icon svg { width: 22px; height: 22px; stroke-width: 1.6; }
    .entry-main { flex: 1; min-width: 0; }
    .entry h2 { font-size: 15px; margin: 0 0 5px; font-weight: 650; }

    .entry:nth-child(3) .entry-icon { background: #e9eef5; color: #667c96; }
    .entry:nth-child(4) .entry-icon { background: var(--line); color: var(--muted); }
    body:has(#preview-dark:checked) .entry:nth-child(2) .entry-icon { background: #38352b; color: #c2b78d; }
    body:has(#preview-dark:checked) .entry:nth-child(3) .entry-icon { background: #2d3440; color: #9aaec7; }
    .bottom { position: absolute; bottom: 26px; left: 20px; right: 20px; display: flex; gap: 12px; align-items: center; }
    .tabs { height: 54px; border-radius: 999px; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-evenly; background: var(--bg); box-shadow: 0 5px 24px #23322d12; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
