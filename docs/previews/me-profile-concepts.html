<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaipa · 我的 / 两版视觉探索</title>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #272c2c; background: #e9edec; }
    body { margin: 0; }
    button, select { font: inherit; }
    button { cursor: pointer; color: inherit; border: 0; background: none; }
    button:focus-visible, select:focus-visible { outline: 2px solid #368c7d; outline-offset: 4px; }
    h1,h2,h3,p { margin: 0; }
    svg { width: 20px; height: 20px; flex-shrink: 0; stroke-width: 1.6; }
    .lab { max-width: 1060px; margin: auto; padding: 32px 32px 48px; }
    .mast { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-bottom: 24px; border-bottom: 1px solid #cfd6d3; }
    .brand { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
    .brand svg { width: 23px; height: 23px; }
    .mast h1 { font-size: 14px; font-weight: 500; color: #636e69; margin-top: 7px; }
    .tools { display: flex; gap: 8px; align-items: center; }
    .tools label { font-size: 12px; color: #636e69; }
    select { color: #272c2c; background: #f6f8f7; border: 1px solid #cfd6d3; padding: 9px 12px; border-radius: 8px; }
    .comparison { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 64px; padding-top: 28px; }
    .concept { min-width: 0; }
    .caption { display: flex; gap: 12px; align-items: center; max-width: 390px; margin: 0 auto 18px; }
    .letter { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #b8c4be; border-radius: 50%; font: 13px ui-monospace, monospace; }
    .caption h2 { font-size: 17px; font-weight: 600; }
    .caption span:last-child { margin-left: auto; font-size: 10px; color: #67756e; }
    .phone { --bg: #f6f6f4; --surface: #fff; --text: #292e2b; --muted: #707a73; --line: #e0e4df; --accent: #3b6451; --soft: #edf0eb; --nav: rgba(255,255,255,.94); position: relative; width: 100%; max-width: 390px; height: 824px; margin: auto; border-radius: 38px; overflow: hidden; isolation: isolate; color: var(--text); background: var(--bg); box-shadow: 0 0 0 1px #00000012, 0 14px 34px #23372c12; }
    .phone[data-mode="dark"] { color-scheme: dark; --bg: #161a18; --surface: #222824; --text: #f0f2ef; --muted: #a5b0a7; --line: #374039; --accent: #b4d5a3; --soft: #2b342d; --nav: rgba(35,42,37,.94); }
    .screen { height: calc(100% - 94px); overflow-y: auto; scrollbar-width: none; padding-bottom: 24px; }
    .screen::-webkit-scrollbar { display: none; }
    .status { height: 46px; padding: 16px 25px 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 650; position: relative; z-index: 2; }
    .status .signals { display: flex; align-items: center; gap: 5px; }
    .signals svg { width: 15px; height: 15px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 7px 20px; position: relative; z-index: 2; }
    .toolbar-right { display: flex; gap: 8px; }
    .icon { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; border-radius: 50%; background: var(--surface); flex-shrink: 0; }
    .icon:hover { filter: brightness(.92); }
    .photographic .status, .photographic .toolbar { color: white; }
    .photographic .icon { background: rgba(255,255,255,.17); backdrop-filter: blur(16px); }
    .cover { height: 330px; position: relative; background: #647c76; }
    .cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 43%; }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg,rgba(0,0,0,.23),transparent 38%,rgba(15,27,21,.04) 60%,rgba(15,27,21,.70)); pointer-events: none; }
    .cover-info { position: absolute; z-index: 1; left: 24px; right: 24px; bottom: 47px; display: flex; align-items: center; gap: 12px; color: #fff; }
    .avatar { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .cover-info .avatar { border: 2px solid #ffffffb3; }
    .identity { flex: 1; min-width: 0; }
    .identity h2 { font-size: 27px; line-height: 1.25; font-weight: 600; }
    .identity small { display: block; margin-top: 5px; font-size: 11px; opacity: .78; }
    .cover-info .edit { color: #fff; background: #ffffff20; width: 34px; height: 34px; }
    .cover-info .edit svg { width: 15px; height: 15px; }
    .a-content { position: relative; margin-top: -27px; border-radius: 24px 24px 0 0; background: var(--bg); padding: 21px 24px 0; }
    .bio { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; margin: 22px 0; }
    .stat { text-align: left; padding: 0; display: flex; align-items: center; gap: 12px; min-height: 42px; }
    .stat + .stat { padding-left: 24px; border-left: 1px solid var(--line); }
    .stat strong { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; line-height: 1.6; color: var(--muted); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 24px 0 12px; }
    .section-head h3 { font-size: 15px; font-weight: 600; }
    .more { display: inline-flex; gap: 3px; align-items: center; color: var(--muted); font-size: 10px; min-height: 28px; padding: 0; }
    .more svg { width: 13px; height: 13px; }
    .recent { width: 100%; display: flex; gap: 14px; align-items: center; padding: 0; text-align: left; }
    .recent > img { width: 88px; height: 94px; border-radius: 12px; object-fit: cover; }
    .recent-text { flex: 1; min-width: 0; }
    .eyebrow { font-size: 9px; color: var(--muted); }
    .recent h3 { font-size: 16px; font-weight: 600; margin: 7px 0 9px; }
    .meta { display: flex; align-items: center; gap: 12px; font-size: 10px; color: var(--muted); }
    .meta span { display: inline-flex; align-items: center; gap: 4px; }
    .meta svg { width: 12px; height: 12px; }
    .recent > svg { width: 14px; color: var(--muted); }
    .saved-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .saved { text-align: left; padding: 0; overflow: hidden; }
    .saved img { width: 100%; height: 74px; border-radius: 10px; display: block; object-fit: cover; }
    .saved span { display: block; font-size: 11px; margin-top: 7px; }
    .trash { display: flex; align-items: center; width: 100%; gap: 10px; border-top: 1px solid var(--line); margin-top: 22px; padding: 17px 0; font-size: 12px; text-align: left; }
    .trash > svg { width: 16px; color: var(--muted); }
    .trash small { color: var(--muted); margin-left: auto; font-size: 11px; }
    .nav { position: absolute; left: 16px; right: 16px; bottom: 20px; height: 58px; border: 1px solid var(--line); border-radius: 30px; background: var(--nav); backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: space-around; padding: 5px 8px; z-index: 5; box-shadow: 0 5px 20px #00000009; }
    .nav button { width: 60px; height: 46px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 24px; color: var(--muted); }
    .nav .active { background: var(--accent); color: var(--bg); width: 76px; font-size: 11px; }
    .home-indicator { position: absolute; height: 4px; width: 112px; border-radius: 4px; background: var(--text); opacity: .8; bottom: 7px; left: calc(50% - 56px); z-index: 6; }
    .b-content { padding: 10px 22px 0; }
    .b-profile { display: flex; align-items: center; gap: 12px; margin: 12px 0 20px; }
    .b-profile .avatar { width: 58px; height: 58px; }
    .b-profile h2 { font-size: 24px; }
    .b-profile small { color: var(--muted); }
    .b-profile .icon { background: transparent; border: 1px solid var(--line); }
    .b-bio { margin-bottom: 20px; }
    .b-bio p:first-child { font-size: 19px; font-weight: 500; margin-bottom: 5px; }
    .b-bio .bio { font-size: 11px; }
    .dashboard { display: grid; grid-template-columns: 1.08fr 1fr; gap: 12px; }
    .journey-tile { position: relative; min-width: 0; height: 190px; overflow: hidden; border-radius: 16px; padding: 18px 16px; text-align: left; color: white; }
    .journey-tile .tile-top { position: absolute; top: 18px; left: 16px; right: 16px; }
    .journey-tile > img { position: absolute; width: 100%; height: 100%; inset: 0; object-fit: cover; object-position: 50% 50%; }
    .journey-tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg,#142b2666,transparent 45%,#142b26c9); }
    .tile-top, .tile-bottom { position: relative; z-index: 1; }
    .tile-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12px; }
    .tile-top svg { width: 15px; height: 15px; }
    .tile-bottom { position: absolute; left: 16px; right: 16px; bottom: 18px; }
    .tile-bottom strong { display: block; font-size: 40px; font-weight: 500; }
    .tile-bottom small { font-size: 10px; color: #e2e9e5; }
    .side-tiles { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .favorite-tile { padding: 16px; border-radius: 16px; background: var(--surface); flex: 1; text-align: left; }
    .favorite-tile .tile-top { color: var(--muted); }
    .favorite-tile strong { display: block; font-size: 32px; font-weight: 500; margin-top: 10px; }
    .favorite-tile small { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
    .mini-trash { display: flex; align-items: center; gap: 7px; height: 58px; padding: 0 15px; border: 1px solid var(--line); border-radius: 16px; text-align: left; }
    .mini-trash svg { width: 15px; color: var(--muted); }
    .mini-trash span { font-size: 11px; flex: 1; }
    .mini-trash small { font-size: 12px; color: var(--muted); }
    .b .section-head { margin-top: 22px; }
    .b .recent { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .b .recent > img { width: 57px; height: 62px; border-radius: 8px; }
    .b .recent h3 { font-size: 14px; margin-top: 4px; margin-bottom: 7px; }
    .b .saved img { height: 93px; }
    .note { max-width: 390px; margin: 24px auto 0; font-size: 12px; line-height: 1.8; color: #606e67; }
    .note strong { display: block; color: #2d3a32; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid #cfd6d3; color: #69766f; font-size: 11px; line-height: 1.8; }
    .toast { position: absolute; z-index: 10; left: 24px; right: 24px; bottom: 92px; padding: 12px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 12px; text-align: center; box-shadow: 0 4px 20px #0002; }
    @media(max-width: 860px) { .comparison { gap: 24px; } .lab { padding: 24px 20px; } }
    @media(max-width: 640px) { .comparison { grid-template-columns: minmax(0,1fr); gap: 38px; } .mast { flex-wrap: wrap; gap: 16px; } .lab { padding: 22px 14px; } .phone { border-radius: 28px; } .caption { margin-bottom: 14px; } }
    @media(prefers-reduced-motion: no-preference) { button { transition: opacity .16s; } button:active { opacity: .65; } }
  </style>
</head>
<body>
  <main class="lab">
    <header class="mast">
      <div><div class="brand"><i data-lucide="mountain"></i> KAIPA</div><h1>我的 / 视觉方向对比</h1></div>
      <div class="tools"><label for="mode">外观</label><select id="mode"><option value="recommended">各自推荐</option><option value="light">均为浅色</option><option value="dark">均为深色</option></select></div>
    </header>
    <div class="comparison">
      <section class="concept"><div class="caption"><span class="letter">A</span><h2>山野影像</h2><span>PHOTO JOURNAL</span></div><div class="phone a" id="a" data-mode="light"></div><p class="note"><strong>先看见人，再看见他的旅行。</strong>封面影像确立重心，个人资料贴近照片，下方用开放式排版承接行程。更有个人主页的情绪，适合愿意展示旅行照片的用户。</p></section>
      <section class="concept"><div class="caption"><span class="letter">B</span><h2>轻装档案</h2><span>FIELD NOTES</span></div><div class="phone b" id="b" data-mode="dark"></div><p class="note"><strong>把旅行的丰富，放进紧凑的秩序里。</strong>头像与简短自述开场，照片、数字和轻量入口错落组合。小面积苔绿强调选中态，功能更集中，日常使用更直接。</p></section>
    </div>
    <footer class="foot">静态视觉探索，未修改正式应用。两版使用相同示例资料与数据；照片为 Unsplash 示例素材，不代表真实行程。封面、最近行程及收藏预览用于比较设计方向，点击入口仅作示意。</footer>
  </main>
  <script src="checklist-selector-assets/lucide.min.js"></script>
  <script>
    const asset = 'me-concept-assets/';
    const icon = name => `<i data-lucide="${name}"></i>`;
    const button = (name, label) => `<button class="icon" title="${label}" aria-label="${label}" data-demo="${label}">${icon(name)}</button>`;
    const status = () => `<div class="status"><span>9:41</span><div class="signals">${icon('signal')}${icon('wifi')}${icon('battery-full')}</div></div>`;
    const toolbar = () => `<div class="toolbar">${button('scan-line','扫一扫')}<div class="toolbar-right">${button('bell','消息通知')}${button('settings-2','设置')}</div></div>`;
    const avatar = '<img class="avatar" src="checklist-selector-assets/avatar.jpg" alt="示例用户头像">';
    const identity = '<div class="identity"><h2>林间</h2><small>@linjian</small></div>';
    const nav = () => `<nav class="nav" aria-label="底部导航"><button title="发现" aria-label="发现" data-demo="发现">${icon('compass')}</button><button title="行程" aria-label="行程" data-demo="行程">${icon('route')}</button><button title="装备" aria-label="装备" data-demo="装备">${icon('backpack')}</button><button class="active" aria-current="page" title="我的" aria-label="我的">${icon('user-round')}<span>我的</span></button></nav><div class="home-indicator"></div>`;
    const head = (label, action) => `<div class="section-head"><h3>${label}</h3><button class="more" data-demo="${action}">查看全部${icon('arrow-up-right')}</button></div>`;
    const recent = () => `<button class="recent" data-demo="山间徒步"><img src="${asset}hike.jpg" alt="山间徒步旅行"><div class="recent-text"><p class="eyebrow">2026.09.06</p><h3>山间徒步</h3><div class="meta"><span>${icon('calendar-days')}3 天</span><span>${icon('users-round')}4 人同行</span></div></div>${icon('chevron-right')}</button>`;
    const saved = () => `<div class="saved-strip"><button class="saved" data-demo="湖畔漫步"><img src="${asset}lake.jpg" alt="湖泊与远山"><span>湖畔漫步</span></button><button class="saved" data-demo="山野寻径"><img src="${asset}mountain.jpg" alt="山间小径目的地"><span>山野寻径</span></button></div>`;
    document.getElementById('a').innerHTML = `<div class="screen"><div class="cover photographic"><img src="${asset}mountain.jpg" alt="旅行封面：阳光下的山峰">${status()}${toolbar()}<div class="cover-info">${avatar}${identity}<button class="icon edit" title="编辑资料" aria-label="编辑资料" data-demo="编辑资料">${icon('pencil')}</button></div></div><div class="a-content"><p class="bio">周末去山里，收集路上的风和日落。</p><div class="stats"><button class="stat" data-demo="我的行程"><strong>12</strong><span>我的<br>行程</span></button><button class="stat" data-demo="我的收藏"><strong>28</strong><span>我的<br>收藏</span></button></div>${head('最近行程','我的行程')}${recent()}${head('我的收藏','我的收藏')}${saved()}<button class="trash" data-demo="回收站">${icon('trash-2')}回收站<small>3 个行程</small>${icon('chevron-right')}</button></div></div>${nav()}`;
    document.getElementById('b').innerHTML = `<div class="screen">${status()}${toolbar()}<div class="b-content"><div class="b-profile">${avatar}${identity}${button('arrow-up-right','编辑资料')}</div><div class="b-bio"><p>周末去山里。</p><p class="bio">收集路上的风和日落。</p></div><div class="dashboard"><button class="journey-tile" data-demo="我的行程"><img src="${asset}mountain.jpg" alt="行程预览：山峰"><div class="tile-top">我的行程${icon('arrow-up-right')}</div><div class="tile-bottom"><strong>12</strong><small>每一程，都有迹可循</small></div></button><div class="side-tiles"><button class="favorite-tile" data-demo="我的收藏"><div class="tile-top">我的收藏${icon('heart')}</div><strong>28</strong><small>下一次出发的灵感</small></button><button class="mini-trash" data-demo="回收站">${icon('trash-2')}<span>回收站</span><small>3</small></button></div></div>${head('最近行程','我的行程')}${recent()}${head('我的收藏','我的收藏')}${saved()}</div></div>${nav()}`;
    lucide.createIcons();
    document.getElementById('mode').addEventListener('change', event => {
      document.querySelectorAll('.phone').forEach(phone => { phone.dataset.mode = event.target.value === 'recommended' ? (phone.id === 'a' ? 'light' : 'dark') : event.target.value; });
    });
    const timers = new WeakMap();
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-demo]');
      if (!target) return;
      const phone = target.closest('.phone');
      clearTimeout(timers.get(phone));
      phone.querySelector('.toast')?.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role','status');
      toast.textContent = `${target.dataset.demo} · 视觉稿，未连接真实数据`;
      phone.append(toast);
      timers.set(phone, setTimeout(() => toast.remove(), 2200));
    });
  </script>
</body>
</html>
