<body><main class="layout"><aside class="intro"><div class="brand">kaipa<span style="color:#a1a6ae;font-weight:400"> / 交互预览</span></div><div class="eyebrow">路线 · 添加地点</div><h1>让地图铺满屏幕，<br>让每个点更好选。</h1><p id="description">地图始终是背景。底部先展示常用标注，展开后可以查看全部，兼顾看路线与快速选点。</p><nav class="variants" aria-label="设计版本"><button class="variant active" data-version="a"><b><span class="num">A</span> 轻量底部列表</b><span>推荐 · 地图优先，列表按需展开</span></button><button class="variant" data-version="b"><b><span class="num">B</span> 地图＋常驻列表</b><span>标注点始终可见，适合按名称选点</span></button><button class="variant" data-version="c"><b><span class="num">C</span> 沉浸地图</b><span>最大地图空间，浮动入口查看标注</span></button></nav><p class="note">交互示意：可拖动地图、双指缩放、滚轮缩放、点标注或轨迹、搜索列表并确认。<br>地图与地点均为示意；正式实现沿用当前路线地图及其地图样式。</p><button class="reset" id="reset">重置当前预览</button></aside>
<section class="phone" data-v="a" aria-label="取点页面预览"><div class="status"><span>9:41</span><div class="island"></div><span>▮▮▮ &nbsp; ▰</span></div><header class="header"><button class="circle" id="back" aria-label="返回">‹</button><button class="header-title" id="routeSwitch">武功山金顶穿越 <span>换一条⌄</span></button></header><div class="hint">点一下线上的位置，或选择标注点</div><div class="map" id="map"><svg id="mapSvg" viewBox="0 0 390 820" aria-label="示意路线地图"><g id="world"><rect x="-1200" y="-1400" width="2800" height="3600" class="terrain"/><g id="terrain"></g><path d="M-120 520 Q80 520 165 615 T510 715" stroke="#bbd7dd" stroke-width="10" fill="none" opacity=".65"/><path d="M-30 684 Q150 734 250 668 T490 633" stroke="#f7f6e9" stroke-width="12" fill="none"/><path d="M-30 684 Q150 734 250 668 T490 633" stroke="#d8d5be" stroke-width="1" fill="none"/><text x="255" y="223" class="label">白鹤峰</text><text x="36" y="367" class="label">高山草甸</text><text x="245" y="561" class="label">羊狮幕方向</text><text x="42" y="661" class="label">龙山村</text><text x="301" y="396" class="label">观音宕</text><path id="trailUnder" class="route-under"/><path id="trail" class="route"/><g id="pins"></g><g id="customPin" style="display:none"><circle r="17" fill="#0a84ff25"/><circle r="7" fill="#0a84ff" stroke="white" stroke-width="3"/></g></g></svg></div><div class="tools"><button class="circle" id="zoomIn" aria-label="放大地图">＋</button><button class="circle" id="zoomOut" aria-label="缩小地图">−</button><button class="circle" id="fit" aria-label="查看整条路线" style="font-size:18px">⌖</button></div><div class="scale"><i></i><span id="scaleText">500 m</span></div><div class="callout" id="callout"></div><button class="floating-list" id="floatingList">☷ &nbsp; 全部标注点 <span>6 ›</span></button><section class="sheet"><button class="handle" id="handle" aria-label="展开或收起标注点"></button><div class="sheet-head"><b>标注点<small>6 个</small></b><button class="link" id="expand">查看全部 ⌃</button></div><div class="tabs"><button class="active" id="tabAll">全部标注</button><button id="tabMap">地图选点</button></div><div class="chips" id="chips"></div><label class="search">⌕ <input id="search" aria-label="搜索标注点" placeholder="搜索标注点" autocomplete="off"></label><div class="rows" id="rows"></div><div class="selected-box"><div class="selected-icon">⌖</div><div class="selected-info"><b id="selectedName">还未选择地点</b><small id="selectedMeta">可以点击轨迹上的任意位置</small></div><span class="map-picked" id="selectedCheck"></span></div><button class="confirm" id="confirm" disabled>用这个点</button></section><div class="toast" id="toast" role="status"></div><div class="home"></div></section></main>
<script>
const points=[{name:'龙山村',km:0,ele:520,x:89,y:603},{name:'发云界',km:5.2,ele:1620,x:115,y:446},{name:'好汉坡',km:9.6,ele:1580,x:238,y:417},{name:'绝望坡',km:12.8,ele:1690,x:179,y:329},{name:'吊马桩',km:17.3,ele:1760,x:281,y:291},{name:'金顶',km:21.6,ele:1918,x:202,y:186}];
const route=[[89,603],[76,568],[100,540],[85,507],[126,481],[115,446],[152,453],[180,429],[213,441],[238,417],[214,385],[229,365],[197,353],[179,329],[214,310],[232,332],[258,316],[281,291],[269,260],[231,266],[244,233],[210,213],[202,186]];
const $=s=>document.querySelector(s),phone=$('.phone'),map=$('#map'),world=$('#world');let variant='a',selected=null,expanded=false,zoom=.85,tx=0,ty=-45,mapOnly=false,timer;
const path=route.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');$('#trail').setAttribute('d',path);$('#trailUnder').setAttribute('d',path);
let contours='';for(let i=0;i<23;i++){const x=25+i*19,y=195+i*7;contours+=`<path class="contour" d="M${x-230} ${y-245} C${x+225} ${y-195} ${x+290} ${y+180} ${x+10} ${y+320} S${x-265} ${y+310} ${x-230} ${y-245}Z"/>`;}$('#terrain').innerHTML=contours;
function render(){phone.dataset.v=variant;phone.classList.toggle('expanded',expanded);document.querySelectorAll('.variant').forEach(b=>b.classList.toggle('active',b.dataset.version===variant));$('#description').textContent={a:'地图始终是背景。底部先展示常用标注，展开后可以查看全部，兼顾看路线与快速选点。',b:'把标注点列表常驻在地图下方。沿路线顺序查看里程和海拔，点列表即可定位；也能切到地图选点。',c:'用最少的控件留出完整地图。底部只保留当前选点与确认，所有标注点从浮动入口打开。'}[variant];$('#expand').textContent=expanded?'收起 ⌄':'查看全部 ⌃';$('#pins').innerHTML=points.map((p,i)=>`<g class="pin ${selected?.index===i?'selected':''}" data-index="${i}" transform="translate(${p.x} ${p.y})">${selected?.index===i?'<circle class="halo" r="22"/>':''}<circle r="12"/><text text-anchor="middle" dy="3.5">${i+1}</text></g>`).join('');$('#chips').innerHTML=points.map((p,i)=>`<button class="chip ${selected?.index===i?'selected':''}" data-index="${i}">${i+1} &nbsp;${p.name}</button>`).join('');renderRows();$('#selectedName').textContent=selected?.name||'还未选择地点';$('#selectedMeta').textContent=selected?`距起点 ${selected.km.toFixed(1)} km${selected.ele!=null?' · 海拔 '+selected.ele+' m':''}`:'可以点击轨迹上的任意位置';$('#selectedCheck').textContent=selected?'✓':'';$('#confirm').disabled=!selected;$('#tabAll').classList.toggle('active',!mapOnly);$('#tabMap').classList.toggle('active',mapOnly);if(variant==='b'){$('#rows').style.display=mapOnly?'none':'';$('.search').style.display=mapOnly?'none':'';$('.sheet').style.height=mapOnly?'208px':'';map.style.bottom=mapOnly?'70px':'';}else{$('#rows').style.display='';$('.search').style.display='';$('.sheet').style.height='';map.style.bottom='';}updateTransform();}
function renderRows(){const query=$('#search').value.trim();$('#rows').innerHTML=points.map((p,i)=>({p,i})).filter(({p})=>p.name.includes(query)).map(({p,i})=>`<button class="row ${selected?.index===i?'selected':''}" data-index="${i}"><span class="order">${i+1}</span><span class="text"><b>${p.name}</b><small>距起点 ${p.km.toFixed(1)} km · 海拔 ${p.ele} m</small></span><span class="tick">${selected?.index===i?'✓':''}</span></button>`).join('')||'<div class="empty">没有匹配的标注点</div>';}
function pick(index,focus=true){selected={...points[index],index};$('#customPin').style.display='none';if(focus){zoom=Math.max(zoom,1.2);tx=(195-selected.x)*zoom;ty=(350-selected.y)*zoom;}if(variant==='c')expanded=false;render();}
function updateTransform(){world.setAttribute('transform',`translate(${195+tx} ${390+ty}) scale(${zoom}) translate(-195 -390)`);$('#scaleText').textContent=Math.round(500/zoom)+' m';}
function zoomBy(factor){zoom=Math.min(3.5,Math.max(.65,zoom*factor));updateTransform();}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',2500);}
function reset(){selected=null;expanded=false;zoom=variant==='a'?.85:1;tx=0;ty=variant==='a'?-45:0;mapOnly=false;$('#search').value='';$('#customPin').style.display='none';render();}
document.querySelectorAll('.variant').forEach(b=>b.onclick=()=>{variant=b.dataset.version;reset();});['#expand','#handle','#floatingList'].forEach(s=>$(s).onclick=()=>{expanded=!expanded;render();});$('#reset').onclick=reset;$('#zoomIn').onclick=()=>zoomBy(1.25);$('#zoomOut').onclick=()=>zoomBy(.8);$('#fit').onclick=()=>{zoom=variant==='a'?.85:1;tx=0;ty=variant==='a'?-45:0;updateTransform();};$('#search').oninput=renderRows;$('#tabAll').onclick=()=>{mapOnly=false;render();};$('#tabMap').onclick=()=>{mapOnly=true;render();};$('#confirm').onclick=()=>selected&&toast('已选择「'+selected.name+'」 · 返回添加行程');$('#back').onclick=()=>toast('返回添加地点 · 预览');$('#routeSwitch').onclick=()=>toast('当前示例仅包含一条轨迹');document.addEventListener('click',e=>{const el=e.target.closest('[data-index]');if(el)pick(Number(el.dataset.index),!el.classList.contains('pin'));});
function svgPosition(x,y){const pt=$('#mapSvg').createSVGPoint();pt.x=x;pt.y=y;return pt.matrixTransform(world.getScreenCTM().inverse());}
function selectOnLine(e){const p=svgPosition(e.clientX,e.clientY);let best=null;for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/(dx*dx+dy*dy)));const x=a[0]+t*dx,y=a[1]+t*dy,d=Math.hypot(p.x-x,p.y-y);if(!best||d<best.d)best={x,y,d,i,t};}if(best.d>30/zoom){toast('请点一下蓝色轨迹上的位置');return;}const km=(best.i+best.t)/(route.length-1)*21.6;selected={name:'距起点 '+km.toFixed(1)+' km',km,x:best.x,y:best.y};$('#customPin').style.display='';$('#customPin').setAttribute('transform',`translate(${best.x} ${best.y})`);render();}
const pointers=new Map();let start=null,moved=false,pinchDistance=0;
map.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.target.closest('.pin'))return;map.setPointerCapture(e.pointerId);start={x:e.clientX,y:e.clientY,tx,ty};moved=false;if(pointers.size===2){const p=[...pointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);moved=true;}});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance)zoomBy(dist/pinchDistance);pinchDistance=dist;moved=true;}else if(start){const rect=$('#mapSvg').getBoundingClientRect(),factor=Math.max(390/rect.width,820/rect.height);const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)moved=true;tx=start.tx+dx*factor;ty=start.ty+dy*factor;updateTransform();}});
map.addEventListener('pointerup',e=>{if(!moved&&!e.target.closest('.pin'))selectOnLine(e);pointers.delete(e.pointerId);start=null;pinchDistance=0;});map.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);start=null;});map.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1);},{passive:false});render();
</script></body></html>
