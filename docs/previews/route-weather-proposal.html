<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路线天气预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#142536;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}.phone{width:390px;min-height:844px;margin:24px auto;padding:54px 18px 28px;background:linear-gradient(160deg,#d8efff 0%,#eaf6ff 35%,#f3f4f6 72%);border-radius:38px;box-shadow:0 18px 50px #183b5425;overflow:hidden}.top{padding:0 12px}.eyebrow{font-size:12px;color:#42657d}.route{font-size:26px;font-weight:750;margin-top:5px}.date{font-size:12px;color:#56748a;margin-top:5px}.hero{display:flex;align-items:center;justify-content:space-between;margin-top:30px}.temp{font-size:82px;line-height:.9;font-weight:280;letter-spacing:-5px}.high{font-size:12px;color:#56748a}.state{font-size:20px;font-weight:650;margin-top:9px}.low{font-size:13px;color:#56748a;margin-top:6px}.sun{width:72px;height:72px;border-radius:50%;background:#fff8c9;box-shadow:0 0 0 14px #fff8c944,0 0 44px #ffe579;position:relative}.sun:after{content:"☀";position:absolute;inset:0;display:grid;place-items:center;color:#f6bb38;font-size:47px}.card{margin-top:24px;padding:14px 12px;background:#ffffff9b;border:1px solid #ffffffb8;border-radius:22px;backdrop-filter:blur(12px)}.heading{font-size:12px;color:#55738a;padding:0 4px 10px;border-bottom:1px solid #aec9da66}.days{display:flex;flex-direction:column}.day{display:flex;align-items:center;min-height:63px;gap:8px;border-bottom:1px solid #aec9da55}.day:last-child{border:0}.dayname{width:44px;font-size:13px;font-weight:650}.small{font-size:11px;color:#648097;margin-top:3px}.icon{width:28px;text-align:center;font-size:22px;color:#f6bd32}.range{display:flex;align-items:center;gap:5px;flex:1;font-size:13px}.muted{color:#7995a9}.track{height:5px;flex:1;border-radius:8px;background:#bed3e1;position:relative;overflow:hidden}.fill{position:absolute;left:12%;width:68%;height:100%;border-radius:8px;background:linear-gradient(90deg,#f7d34f,#fa8530)}.metrics{display:flex;gap:8px;margin-top:16px}.metric{flex:1;padding:14px;background:#ffffff9b;border:1px solid #ffffffb8;border-radius:18px}.metric-label{font-size:11px;color:#648097}.metric-value{font-size:27px;margin-top:9px}.note{font-size:11px;line-height:18px;color:#648097;margin:17px 6px 0}
</style>
<main class="phone"><section class="top"><div class="eyebrow">路线天气</div><div class="route">良庆区 · 山脊线</div><div class="date">10月9日 · 周四</div><div class="hero"><div><div class="high">今日最高</div><div class="temp">32°</div><div class="state">晴</div><div class="low">最低 21° · 最高 32°</div></div><div class="sun"></div></div></section><section class="card"><div class="heading">7 日天气预报</div><div class="days"><div class="day"><div class="dayname">今天<div class="small">10/09</div></div><div class="icon">☀</div><div class="range"><span class="muted">21°</span><div class="track"><div class="fill"></div></div><b>32°</b></div></div><div class="day"><div class="dayname">周五<div class="small">10/10</div></div><div class="icon">🌤</div><div class="range"><span class="muted">23°</span><div class="track"><div class="fill" style="left:18%;width:62%"></div></div><b>33°</b></div></div><div class="day"><div class="dayname">周六<div class="small">10/11</div></div><div class="icon">☀</div><div class="range"><span class="muted">25°</span><div class="track"><div class="fill" style="left:27%;width:60%"></div></div><b>35°</b></div></div><div class="day"><div class="dayname">周日<div class="small">10/12</div></div><div class="icon">🌤</div><div class="range"><span class="muted">24°</span><div class="track"><div class="fill" style="left:22%;width:64%"></div></div><b>34°</b></div></div></div></section><div class="metrics"><div class="metric"><div class="metric-label">降水概率</div><div class="metric-value">10%</div><div class="small">当日最高概率</div></div><div class="metric"><div class="metric-label">最大风速</div><div class="metric-value">12</div><div class="small">km/h</div></div></div><div class="note">预报对应路线附近坐标，不代表整条山地路线。出发前还需核实通行情况。</div></main>
