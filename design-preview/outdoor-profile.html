<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaipa 户外档案卡片方案预览</title>
  <style>
    :root{--bg:#f4f5f7;--surface:#fff;--surface-2:#eef1f4;--text:#17202a;--text-2:#66717d;--text-3:#9aa4af;--line:#e1e5e9;--accent:#1d7f70;--accent-soft:#dcefe9;--danger:#bd4d4d;--shadow:0 12px 30px rgba(26,39,50,.08)}
    [data-theme="dark"]{--bg:#161a1d;--surface:#20262a;--surface-2:#2a3237;--text:#f0f3f4;--text-2:#aab5bb;--text-3:#78858d;--line:#354047;--accent:#65c4ad;--accent-soft:#244c44;--shadow:0 14px 34px rgba(0,0,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1040px;margin:0 auto;padding:34px 22px 64px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--text-3);letter-spacing:.08em}.title{font-size:28px;line-height:1.2;margin:5px 0 0;font-weight:780}.theme-toggle{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:22px;padding:8px 14px;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:24px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:20px;padding:9px 15px;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:white}.stage{display:grid;grid-template-columns:minmax(0,520px) minmax(260px,1fr);gap:28px;align-items:start}.phone{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;max-width:520px}.phone-head{display:flex;align-items:center;gap:12px;padding:4px 3px 20px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#d5e7e1;color:#226c5d;font-weight:800;font-size:19px}.name{font-weight:750}.sub{font-size:13px;color:var(--text-2)}.dots{margin-left:auto;color:var(--text-3);font-size:23px}.card{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:19px;cursor:pointer;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;gap:10px}.icon{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.card-title{font-weight:780;font-size:17px}.arrow{margin-left:auto;color:var(--text-3);font-size:22px}.description{color:var(--text-2);margin:14px 0 16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:var(--surface-2);border-radius:12px;padding:11px 8px}.metric b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.metric span{display:block;color:var(--text-3);font-size:11px;margin-top:2px}.cta{display:flex;justify-content:flex-end;color:var(--accent);font-weight:700;margin-top:15px}.progress-wrap{margin:18px 0 4px}.progress-label{display:flex;justify-content:space-between;color:var(--text-2);font-size:13px}.progress{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit;width:75%}.identity{text-align:center;padding:16px 6px 20px}.identity .avatar{width:66px;height:66px;margin:0 auto 9px;font-size:26px}.identity h2{margin:0;font-size:21px}.identity p{margin:3px 0;color:var(--text-2)}.identity .meta{font-size:13px;color:var(--text-3);margin-top:10px}.empty{border:1px dashed var(--line);background:var(--surface-2);text-align:center;padding:23px 16px;border-radius:14px;color:var(--text-2)}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}.notes{padding:8px 4px}.notes h3{margin:0 0 13px;font-size:16px}.notes p{color:var(--text-2);margin:0 0 12px}.notes ul{padding-left:20px;color:var(--text-2);margin:0}.notes li{margin:7px 0}.badge{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:10px;margin-left:7px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(420px,100%);background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.dialog h2{margin:0 0 4px}.dialog p{color:var(--text-2);margin:0 0 17px}.field{margin:12px 0}.field label{display:block;color:var(--text-2);font-size:13px;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:15px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.actions button{border:0;border-radius:10px;padding:10px 15px;cursor:pointer}.cancel{background:var(--surface-2);color:var(--text-2)}.save{background:var(--accent);color:white}@media(max-width:760px){.shell{padding:24px 16px 48px}.stage{display:block}.notes{margin-top:25px}.phone{max-width:none}.metrics{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">KAIPA / 我的</div><h1 class="title">户外档案卡片方案</h1></div><button class="theme-toggle" id="theme">切换深色</button></header>
    <nav class="tabs" aria-label="方案切换"><button class="tab active" data-plan="all">全部方案</button><button class="tab" data-plan="a">A 状态卡片</button><button class="tab" data-plan="b">B 户外身份</button><button class="tab" data-plan="c">C AI 个性化</button><button class="tab" data-plan="d">D 紧凑设置行</button></nav>
    <section class="stage"><div class="phone"><div class="phone-head"><div class="avatar">林</div><div><div class="name">林间来信</div><div class="sub">@forest_note</div></div><div class="dots">···</div></div><div id="preview"></div></div><aside class="notes"><h3 id="plan-title">方案 A：档案状态卡片 <span class="badge">推荐</span></h3><p id="plan-copy">让用户在“我的”首页直接看到档案是否完整，同时保留 AI 使用场景。</p><ul id="plan-points"><li>已填写字段直接展示摘要</li><li>整张卡片和操作文字都可点击</li><li>空状态引导“完善户外档案”</li></ul></aside></section>
  </main>
  <div class="modal" id="modal"><div class="dialog"><h2>编辑户外档案</h2><p>这些信息会用于生成更适合你的装备、路餐和补给建议。</p><div class="field"><label>身高（cm）</label><input value="175" /></div><div class="field"><label>体重（kg）</label><input value="68" /></div><div class="field"><label>年龄</label><input value="29" /></div><div class="actions"><button class="cancel" id="cancel">取消</button><button class="save" id="save">保存</button></div></div></div>
  <script>
    const plans={a:{title:'方案 A：档案状态卡片',copy:'让用户在“我的”首页直接看到档案是否完整，同时保留 AI 使用场景。',points:['已填写字段直接展示摘要','整张卡片和操作文字都可点击','空状态引导“完善户外档案”'],html:`<article class="card" data-edit><div class="card-head"><div class="icon">◎</div><div class="card-title">户外档案</div><div class="arrow">›</div></div><p class="description">让 AI 更了解你的户外习惯</p><div class="metrics"><div class="metric"><b>175</b><span>身高 cm</span></div><div class="metric"><b>68</b><span>体重 kg</span></div><div class="metric"><b>29</b><span>年龄</span></div><div class="metric"><b>已填</b><span>饮食忌口</span></div></div><div class="cta">编辑档案　›</div></article>`},b:{title:'方案 B：户外身份卡片',copy:'将档案与头像、昵称绑定，增强个人户外身份感。',points:['视觉上更像个人资料','未来可扩展户外偏好标签','适合社区和同行场景'],html:`<article class="card" data-edit><div class="identity"><div class="avatar">林</div><h2>林间来信</h2><p>我的户外档案</p><div class="meta">身高 175 cm　体重 68 kg　年龄 29 岁</div></div><div class="cta">查看并编辑　›</div></article>`},c:{title:'方案 C：AI 个性化入口卡片',copy:'突出档案对 AI 规划的作用，用完成度推动用户补全。',points:['完成度一眼可见','适合 AI 功能较强的产品定位','可在生成建议后提示更新'],html:`<article class="card" data-edit><div class="card-head"><div class="icon">✦</div><div class="card-title">AI 户外档案</div><div class="arrow">›</div></div><div class="progress-wrap"><div class="progress-label"><span>档案完成度</span><b>3 / 4</b></div><div class="progress"><i></i></div></div><p class="description">生成更适合你的装备与补给建议</p><div class="cta">完善档案　›</div></article>`},d:{title:'方案 D：紧凑设置行',copy:'用最小空间保留入口，适合希望“我的”页面保持简洁的方向。',points:['实现成本最低','不打断现有内容卡片布局','档案摘要和引导较弱'],html:`<article class="card" data-edit><div class="card-head"><div class="icon">◎</div><div class="card-title">户外档案</div><span class="badge">已填写 3 项</span><div class="arrow">›</div></div></article>`}};
    const preview=document.querySelector('#preview');const title=document.querySelector('#plan-title');const copy=document.querySelector('#plan-copy');const points=document.querySelector('#plan-points');
    function bindCards(){preview.querySelectorAll('[data-edit]').forEach(card=>card.addEventListener('click',()=>document.querySelector('#modal').classList.add('open')))}
    function render(key){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.plan===key));if(key==='all'){preview.innerHTML=Object.entries(plans).map(([id,p])=>`<div style="margin-bottom:18px"><div class="eyebrow" style="margin:0 0 7px 2px">${p.title}${id==='a'?'<span class="badge">推荐</span>':''}</div>${p.html}</div>`).join('');title.innerHTML='四个方案总览';copy.textContent='先整体比较卡片的信息密度，再点击任意卡片体验编辑流程。';points.innerHTML='<li>每张卡片都可以点击</li><li>可切换浅色与深色模式</li><li>手机宽度会自动适配</li>';bindCards();return}const p=plans[key];preview.innerHTML=p.html;title.innerHTML=p.title+(key==='a'?' <span class="badge">推荐</span>':'');copy.textContent=p.copy;points.innerHTML=p.points.map(x=>`<li>${x}</li>`).join('');bindCards()}render('all');
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.plan)));document.querySelector('#theme').addEventListener('click',()=>{const dark=document.body.dataset.theme==='dark';document.body.dataset.theme=dark?'':'dark';document.querySelector('#theme').textContent=dark?'切换深色':'切换浅色'});document.querySelector('#cancel').addEventListener('click',()=>document.querySelector('#modal').classList.remove('open'));document.querySelector('#save').addEventListener('click',()=>{document.querySelector('#modal').classList.remove('open');alert('已保存（原型演示）')});document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});
  </script>
</body>
</html>
